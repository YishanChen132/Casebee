services:
  postgres:
    image: postgres:16-alpine
    container_name: casebee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: casebee
      POSTGRES_USER: casebee
      POSTGRES_PASSWORD: casebee
    ports:
      - "5432:5432"
    volumes:
      - casebee-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casebee -d casebee"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  casebee-postgres-data:
